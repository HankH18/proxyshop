# The `buyer-web` server block. Mounted read-only over the stock image's
# /etc/nginx/conf.d/default.conf by `apps/buyer/compose.yaml`.
#
# WHY THIS FILE EXISTS RATHER THAN A STATIC MOUNT ON buyer-svc. The SPA in `apps/buyer/app/`
# fetches every endpoint as a bare relative path -- '/buyer/auth/magic-link',
# '/buyer/intent/clarify', '/buyer/auctions/<id>', '/buyer/shortlist/render' and the rest --
# through a plain `fetch(input, init)` with no base URL and no VITE_* override anywhere in
# the source. `buyer_svc.main` installs no CORS middleware. So the page and the API MUST be
# one origin, and a bare static file server on its own port cannot be that origin. This block
# is the origin: static files from the built bundle, everything under /buyer/ proxied to the
# API container.
#
# THE OTHER HALF, and the reason this is not simply `mount_ui` on buyer-svc:
# `composition.mount_ui` mounts `StaticFiles(..., html=True)` at '/', which serves index.html
# for '/' and 404s every other path that is not a real file. That is not SPA routing, and the
# repo already documents the consequence -- a magic link whose base URL is anything but the
# origin root is dead before the page loads. `try_files ... /index.html` below is the
# fallback that mount cannot have, and it is why the deep-link 404 is gone rather than
# worked around. (mount_ui also cannot be reached from this stack at all: the container's
# CMD is `uvicorn buyer_svc.main:app`, `main.py` is frozen, has no hook, and never calls it.)

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A shopper's clarify -> confirm -> shortlist round trip is a real auction with a real
    # bid window behind it, so the default 60s read timeout is too short to be safe here.
    client_max_body_size 1m;

    # THE API, SAME ORIGIN. Resolved through Docker's embedded DNS at request time rather
    # than baked in at startup: with a literal host in `proxy_pass`, nginx resolves the name
    # ONCE when it loads the configuration and caches the address forever, so a buyer-svc
    # that is recreated (a rebuild, a `compose up` after an edit) gets a new container IP and
    # every request 502s until nginx is restarted too. The `resolver` + variable form re-reads
    # the name, which is what makes this survive the edit-rebuild loop a demo lives in.
    location /buyer/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $buyer_api http://buyer-svc:8081;
        proxy_pass $buyer_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
    }

    # THE SPA. `try_files` is the fallback `StaticFiles(html=True)` does not have: any path
    # that is not a real file is answered with index.html so the client-side route resolves,
    # and the magic link's `?token=` query survives because a query string is not part of the
    # `$uri` this tests.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The bundle is content-hashed by vite (`/assets/index-<hash>.js`), so it may be cached
    # hard; index.html must never be, or an operator who rebuilds the UI keeps being served
    # the previous bundle's asset names.
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
