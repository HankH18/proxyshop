[project]
name = "proxyshop"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "proxyshop-contracts","proxyshop-llm","proxyshop-store-agent","proxyshop-verification",
  "proxyshop-buyer-svc","proxyshop-merchant-svc","proxyshop-exchange","proxyshop-trust",
  "proxyshop-seller-reference","proxyshop-ingest","proxyshop-shopify-stub","proxyshop-sim",
  "proxyshop-fixtures",
  # TWO OF THESE ARE INVISIBLE TO AN IMPORT SCAN and must not be cut by one:
  #   email-validator  pydantic reaches it LAZILY while building the schema for
  #                    `apps/buyer/svc/src/auth/routes.py:36`'s `EmailStr` field. Its absence
  #                    is what crash-looped buyer-svc on its first deploy.
  #   lxml             asked for BY NAME as a BeautifulSoup parser at
  #                    `services/ingest/src/adapters/signed_fetch.py:472`, never imported.
  #                    Without it extraction silently falls back to html.parser.
  #
  # Eight more were declared here and reached by NOTHING — no import anywhere in the repo and
  # no lazy consumer either — so they were removed: python-multipart, pydantic-settings, mcp,
  # cryptography, pyjwt, scipy, structlog, tenacity.
  #
  # python-multipart is the one that nearly survived the sweep by LOOKING load-bearing, and it
  # is the reason the removals were measured by running rather than by grepping.
  # `starlette/formparsers.py:18` imports it AT MODULE SCOPE — spelled `python_multipart`, not
  # `multipart`, so grepping either name alone misses it — on the path every `import fastapi`
  # takes. It is still optional: that import sits under `try/except ModuleNotFoundError` which
  # leaves `multipart = None` and fails only when a form is PARSED, and neither fastapi nor
  # starlette requires the wheel (both put it in an extra). Nothing here parses a form — no
  # `Form`/`File`/`UploadFile` parameter and no `request.form()` — measured by importing all
  # six services with the wheel made absent: every app builds, and every published OpenAPI
  # carries no form body. NOTE for anyone repeating that probe: block it by raising
  # `ModuleNotFoundError`, which is what an absent distribution raises; a bare `ImportError`
  # escapes starlette's guard and reports a false dependency on every service.
  #
  # The other seven are plainer: pyjwt is unimported (no `import jwt` anywhere) and is what
  # would otherwise have pulled cryptography; structlog was declared and DELIBERATELY unused —
  # see `proxyshop_support/logging_config.py`, which configures the stdlib root logger instead.
  # Add any of them back in the same commit as the importer, never before it.
  "fastapi==0.141.1","uvicorn[standard]==0.52.4",
  "pydantic==2.13.5","email-validator==2.3.0",
  "httpx==0.28.1","anthropic==1.2.0",
  "psycopg[binary,pool]==3.3.5","neo4j==5.28.5","redis[hiredis]==8.1.0",
  "jsonschema[format]==4.26.0",
  "beautifulsoup4==4.15.0","lxml==6.1.2","protego==0.6.2",
  "numpy==2.5.2",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers==6.0.1","torch==2.13.0"]   # NEVER installed by default (D18)

[dependency-groups]
dev = [
  "pytest==9.1.1","pytest-asyncio==1.4.0","pytest-cov==7.1.0","pytest-timeout==2.4.0",
  "pytest-socket==0.7.0","hypothesis==6.167.1","respx==0.23.1","time-machine==3.5.0",
  "syrupy==6.0.0","datamodel-code-generator==0.76.0",
  "ruff==0.16.5","mypy==2.3.1","import-linter==2.14",
  "types-jsonschema==4.26.0.20260518","types-pyyaml==6.0.12.20260815",
]

[tool.uv.sources]
proxyshop-contracts = { workspace = true }
proxyshop-llm = { workspace = true }
proxyshop-store-agent = { workspace = true }
proxyshop-verification = { workspace = true }
proxyshop-buyer-svc = { workspace = true }
proxyshop-merchant-svc = { workspace = true }
proxyshop-exchange = { workspace = true }
proxyshop-trust = { workspace = true }
proxyshop-seller-reference = { workspace = true }
proxyshop-ingest = { workspace = true }
proxyshop-shopify-stub = { workspace = true }
proxyshop-sim = { workspace = true }
proxyshop-fixtures = { workspace = true }

[tool.uv.workspace]
# explicit list: an `apps/*` glob does NOT match apps/buyer/svc or apps/merchant/svc
members = [
  "packages/contracts","packages/llm","packages/store-agent","packages/verification",
  "apps/buyer/svc","apps/merchant/svc","apps/exchange","apps/trust","apps/seller-reference",
  "services/ingest","services/shopify-stub","services/sim","fixtures",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# T-000 (R1b): the root distribution ships `proxyshop_support/` — the orchestrator-owned
# shared runtime helpers (Redis worker wrapper D39, clocks, doubles, fixture loader) — and,
# in editable mode, puts the repo root and `.pkgroot/` on `sys.path`. `.pkgroot/<pkg>` is a
# tracked symlink to each workspace member's FLAT `src/` directory, which is what makes
# `exchange.ranking`, `store_agent.hooks`, `merchant_svc.onboarding`, ... importable under
# the flat layout that every `tickets.json` scope glob requires. See the member manifests.
[tool.hatch.build.targets.wheel]
packages = ["proxyshop_support"]
dev-mode-dirs = [".", ".pkgroot"]

[tool.pytest.ini_options]
minversion = "8.2"
addopts = "--import-mode=importlib --strict-markers --strict-config --timeout=300 -ra"
consider_namespace_packages = true
pythonpath = [".", ".pkgroot"]   # .pkgroot: flat-src import namespaces (R1b)
testpaths = ["packages","apps","services","pixel","fixtures","e2e","docs","proxyshop_support"]
norecursedirs = [".*", "node_modules", "dist", "build", ".venv", "*.egg-info", ".swarm-loop"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "docker: requires the compose datastore stack",
  "graph: writes to Neo4j (takes the shared flock)",
  "slow: long-running simulation or e2e",
  "needs_model: requires downloaded embedding weights; deselected from make verify",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["node_modules",".venv","dist","build",".swarm-loop",".pkgroot",".t210-*"]
# `.t210-*`: T-210's lock-exit-status probe builds a throwaway pytest tree with
# `tempfile.mkdtemp(prefix=".t210-", dir=REPO_ROOT)` and sweeps it when it finishes. It lives
# inside the repo root because the probe has to run pytest against a real tree, and its
# generated files are DELIBERATELY malformed -- `assert False, "simulated product defect"` is
# the point of them. Ruff walking one is always wrong, and while a single-threaded run never
# sees one, a lint that overlaps a concurrent pytest does: measured twice today, `make verify`
# died at the lint step on B011 and I001 inside a directory that no longer existed by the time
# anyone looked. Excluding the pattern makes the gate independent of what else is running.
# Without this, `extend-exclude` is honoured only when ruff DISCOVERS a file by walking a
# directory. Any explicitly-named path — `ruff check .swarm-loop/acceptance`, a pre-commit
# hook passing filenames, an editor linting the open file — is linted anyway, which would
# put ruff's opinions on the frozen acceptance suite. force-exclude makes the exclusion
# apply to named paths too.
force-exclude = true
[tool.ruff.lint]
select = ["E","F","I","UP","B","ASYNC"]
ignore = ["E501"]
[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B"]
"e2e/**" = ["B"]

[tool.mypy]
python_version = "3.12"
namespace_packages = true
explicit_package_bases = true
# T-000 (R1b): mypy is pointed at `.pkgroot` rather than at ["packages","apps","services"].
# Under the FLAT src layout the original list cannot work: with explicit_package_bases mypy
# derives a module name from the path, and three member directories are hyphenated
# (packages/store-agent, services/shopify-stub, apps/seller-reference) so `store-agent` is
# not a valid identifier. mypy falls back to the __init__.py walk-up, which names all three
# `src` and aborts with `Duplicate module named "src"` before checking anything. Going
# through the `.pkgroot/<pkg>` symlinks gives every member its real, unique import name
# (`exchange`, `store_agent`, ...), so ALL member source is type-checked — the trade is that
# `<member>/tests/` is not (those paths hit the same hyphen/duplicate-basename problem).
mypy_path = ".pkgroot"
files = [".pkgroot", "e2e", "proxyshop_support", "conftest.py", "scripts"]
exclude = "(node_modules|\\.venv|dist|build|\\.swarm-loop)"
ignore_missing_imports = true          # workers cannot edit this file to add overrides
strict = false
disallow_untyped_defs = false
warn_unused_ignores = false
# `disallow_untyped_defs = false` is deliberate — a worker may ship an unannotated helper.
# But mypy's DEFAULT is to then skip that function's BODY entirely, so an unannotated
# `def score(bid): total: int = "not a number"` type-checks clean and `make verify` is
# green on a flat type error. Bodies are checked regardless of the signature; only the
# signature stays optional.
check_untyped_defs = true
