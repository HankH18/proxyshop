# Compose fragment included by the root docker-compose.yml. Created by T-000 as a valid
# empty stub so the root file's `include:` list is static from day one and no worker ever
# edits it (B6(ii)). Owner: the store-agent lane. Filled by T-313.
#
# The store-agent runner.
#
# It serves the one operation its published contract declares — `POST /v1/bid-requests`, the
# door the exchange solicits this store's bid through (`packages/store-agent/src/solicitation/
# routes.py`, mounted by the frozen `main.py` glob). Until T-309 there was no `routes.py`
# anywhere under that tree and this container was an HTTP server with an empty route table;
# the warning that used to stand here said so.
#
# ⚠️ IT STILL NEEDS A STORE. A hosted agent process advocates for exactly one store, and the
# `BidRequest` on the wire does not name one — the exchange chooses which agent to POST to.
# So the store context is deployment configuration. With none set the agent answers every
# solicitation `204 store_context_unconfigured`, which is fail-closed and correct — an agent
# with no approved envelope has no authorization to offer anything, and `collect_bids`
# represents a silent store at catalogue list price (R10) — but it is not a store bidding.
#
# To make it bid, an operator adds BOTH halves — the file has to be inside the container, so
# the env var alone does nothing:
#
#     volumes:
#       - ./fixtures/envelopes/store-alpha.approved.json:/srv/store-context.json:ro
#     environment:
#       STORE_AGENT_CONTEXT: /srv/store-context.json
#       STORE_AGENT_STORE_DOMAIN: store-alpha.example.com
#
# There is no default `volumes:` entry on purpose: a default path would mount a store this
# deployment never approved. The domain matters more than it looks — an offer with no
# `checkout_url` is dropped from every shortlist by the exchange's C10 check, and the agent
# will not synthesise a host it was not given.
#
# ⚠️ THE HEALTHCHECK BELOW DOES NOT PROVE THE AGENT CAN BID. It probes /openapi.json, which
# answers 200 whether or not a store context was resolved — so a container whose
# STORE_AGENT_CONTEXT is a typo reports HEALTHY while every solicitation is a 500. It cannot
# probe the bid door instead: POSTing a synthetic BidRequest every ten seconds would make the
# agent answer auctions nobody opened, and the served surface is asserted to be EXACTLY the
# one operation the contract publishes (T-309), so there is no /healthz to add without
# breaking that gate. Read "healthy" as "the process is up", never as "the store is bidding";
# the honest check is one real POST /v1/bid-requests after deploy.
services:
  store-agent:
    build:
      # Relative to THIS file's directory, so the context is the repo root.
      context: ../..
      dockerfile: packages/store-agent/Dockerfile
    # D40: env-overridable. 8086 continues the 808x block after ingest's 8085.
    ports:
      - "${STORE_AGENT_PORT:-8086}:8086"
    environment:
      PROXYSHOP_WORKER: "${PROXYSHOP_WORKER:-1}"
      LLM_PROVIDER: "${LLM_PROVIDER:-double}"
      # Unset by default, and deliberately: a default path would point at a store this
      # deployment never approved. See the header for what happens with them unset.
      STORE_AGENT_CONTEXT: "${STORE_AGENT_CONTEXT:-}"
      STORE_AGENT_STORE_DOMAIN: "${STORE_AGENT_STORE_DOMAIN:-}"
    # No depends_on: the shipped closure opens no socket and touches no datastore. Adding a
    # postgres/redis dependency here would be decoration, and would make this container wait
    # on services it never speaks to.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8086/openapi.json').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m       # D10
    stop_grace_period: 10s
    restart: unless-stopped
