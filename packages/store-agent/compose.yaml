# Compose fragment included by the root docker-compose.yml. Created by T-000 as a valid
# empty stub so the root file's `include:` list is static from day one and no worker ever
# edits it (B6(ii)). Owner: the store-agent lane. Filled by T-313.
#
# The store-agent runner.
#
# It serves the one operation its published contract declares — `POST /v1/bid-requests`, the
# door the exchange solicits this store's bid through (`packages/store-agent/src/solicitation/
# routes.py`, mounted by the frozen `main.py` glob). Until T-309 there was no `routes.py`
# anywhere under that tree and this container was an HTTP server with an empty route table;
# the warning that used to stand here said so.
#
# ⚠️ THE `store-agent` SERVICE BELOW STILL NEEDS A STORE. A hosted agent process advocates for
# exactly one store, and the `BidRequest` on the wire does not name one — the exchange chooses
# which agent to POST to. So the store context is deployment configuration. With none set the
# agent answers every solicitation `204 store_context_unconfigured`, which is fail-closed and
# correct — an agent with no approved envelope has no authorization to offer anything, and
# `collect_bids` represents a silent store at catalogue list price (R10) — but it is not a
# store bidding. That unconfigured service is kept as the template it always was; the four
# CONFIGURED agents are below it, under the `demo` profile.
#
# To make one bid, an operator adds BOTH halves — the file has to be inside the container, so
# the env var alone does nothing:
#
#     volumes:
#       - ./fixtures/envelopes/store-alpha.approved.json:/srv/store-context.json:ro
#     environment:
#       STORE_AGENT_CONTEXT: /srv/store-context.json
#       STORE_AGENT_STORE_DOMAIN: store-alpha.example.com
#
# There is no default `volumes:` entry on THAT service on purpose: a default path would mount
# a store this deployment never approved. The domain matters more than it looks — an offer
# with no `checkout_url` is dropped from every shortlist by the exchange's C10 check, and the
# agent will not synthesise a host it was not given.
#
# ─────────────────────────────────────────────────────────────────────────────────────────
# HOW N STORES ARE EXPRESSED, and why it is N SERVICES rather than one scaled service.
# ─────────────────────────────────────────────────────────────────────────────────────────
# A market with one merchant in it is not a market, and until now compose could not express a
# second one at all. The reason is structural rather than an oversight, and `apps/buyer/
# devstack/run.py` states it where it works around it: "`configure_solicitation(app,
# context=...)`, NOT `STORE_AGENT_CONTEXT`. That env var is process-wide and names exactly one
# file, so it cannot describe three stores." The devstack escapes by building three app
# objects in ONE interpreter and configuring each in memory — a seam a container cannot use,
# because its CMD is `uvicorn store_agent.main:app` and nothing on that path can call a
# configure function.
#
# So a store agent's identity is: one process, one context FILE, one `store_id` inside it.
# That rules out `deploy.replicas` / `docker compose up --scale`: replicas of a service share
# its environment and its volumes byte for byte, so N replicas would be N processes all
# advocating for the SAME store — which is worse than one, because the exchange would collect
# the same bid N times believing it had found N merchants.
#
# What varies per store, and therefore what has to be per SERVICE:
#   * the mounted context file       — `deploy/demo/store-contexts/<host>.json`
#   * STORE_AGENT_CONTEXT            — where that file lands inside the container
#   * STORE_AGENT_STORE_DOMAIN       — the registered host the checkout_url is built on
#   * the published host port        — so a human can curl one agent directly
# What does NOT vary: the image (one build, four containers) and the CONTAINER port, which is
# a literal 8086 in `packages/store-agent/Dockerfile` (EXPOSE and the uvicorn line both) with
# no env var that moves it. Peers therefore address an agent as `http://<service>:8086`, and
# `deploy/demo/exchange-deployment.json` writes exactly those URLs into `sellers[].
# bid_endpoint`. The service names below and `scripts/build_demo_deployment.py`'s
# `agent_service()` have to agree; that function is the one place the mapping lives.
#
# YAML anchors carry the shared half so the four blocks differ only in what genuinely differs.
# Compose merges `<<:` before it validates, so this is one image and four configurations, not
# four opportunities to drift.
#
# ⚠️ THE HEALTHCHECK BELOW DOES NOT PROVE THE AGENT CAN BID. It probes /openapi.json, which
# answers 200 whether or not a store context was resolved — so a container whose
# STORE_AGENT_CONTEXT is a typo reports HEALTHY while every solicitation is a 500. It cannot
# probe the bid door instead: POSTing a synthetic BidRequest every ten seconds would make the
# agent answer auctions nobody opened, and the served surface is asserted to be EXACTLY the
# one operation the contract publishes (T-309), so there is no /healthz to add without
# breaking that gate. Read "healthy" as "the process is up", never as "the store is bidding";
# the honest check is one real POST /v1/bid-requests after deploy.
# ─────────────────────────────────────────────────────────────────────────────────────────
# THE SHOP'S OWN VOICE, which could not be switched on from compose at all until this block
# existed — and the comment it replaces asserted that it never could.
# ─────────────────────────────────────────────────────────────────────────────────────────
# What stood on the `store-agent` service said: "NO LLM_PROVIDER. The agent negotiates from its
# store context and a policy, not from a model: `packages/store-agent/Dockerfile` copies
# contracts, proxyshop_support and `packages/store-agent/src` only — no `llm` package is in the
# image — and nothing under that tree imports one." Every clause of that is now false, and two
# of them are false in the source rather than in a build artifact:
#
#   * `packages/store-agent/Dockerfile:151` copies `packages/llm/src` into the image, and `:114`
#     installs `anthropic==1.2.0`;
#   * `runtime/pitch.py:101` and `solicitation/copywriter.py:68` both `import llm` at MODULE
#     SCOPE — this image cannot import its own bidding runtime without the package.
#
# D55 is why withholding the provider was the wrong default rather than a cautious one. A
# dedicated advocate that argues its store's case in the store's OWN voice is the service a
# shop buys by joining the network; with no provider forwarded, every hosted agent ran the
# offline double, and what a shopper read was the platform's deterministic slot-filled
# fallback presented as the merchant's pitch.
#
# `double` remains the DEFAULT — D19/D20 keep the shipped stack offline and the suite off the
# network — and `anthropic` is now reachable by setting one variable. Forwarding the key is
# what makes that setting honest: `AnthropicLLM.__init__` does no I/O, so a container with the
# provider set and no key did not fail at startup; it failed inside `compose_pitch`, which
# caught the error and served the fallback at 200 OK while the healthcheck said (healthy).
# With the key forwarded, `packages/llm` raises a legible MissingApiKeyError naming it.
#
# Empty is the offline default. Put a real key in `.env`, which is untracked; never in
# `.env.example`, which is committed.
x-store-agent-llm: &store-agent-llm
  LLM_PROVIDER: "${LLM_PROVIDER:-double}"
  ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
  # Model ids are config, not code (C4), and this one is written in three places pinned to
  # each other: `packages/llm/src/config.py`'s DEFAULT_STORE_AGENT_MODEL, `.env.example`, and
  # here. All three move together, or `test_the_documented_defaults_are_the_values_env_example
  # _ships` goes red for no change in behaviour.
  STORE_AGENT_MODEL: "${STORE_AGENT_MODEL:-claude-sonnet-5}"
  # ── THE PITCH BUDGET, which existed in code and in no deployment ────────────────────────
  # `STORE_AGENT_PITCH_TIMEOUT_SECONDS` has been read by
  # `solicitation/copywriter.py:resolve_pitch_timeout` since the copywriter was written and was
  # set in NO compose file and NO .env.example — an operator whose agents were timing out had
  # no supported way to move the number, which is this repository's recurring "configuration
  # nothing sets" defect. Both are on the SHARED anchor, so all four hosted agents inherit
  # them; an empty value means "use the code default", because both resolvers treat an empty
  # string, a non-number and a non-positive number as unset and log a WARNING.
  #
  # These are a CEILING and a RESERVE, not the budget. The budget is per solicitation and comes
  # from the exchange's own `respond_by` on the BidRequest:
  #     budget = min(TIMEOUT, respond_by - now - RESERVE)   floored at 0
  # A budget of 0 means the model is not called at all and the bid ships immediately with the
  # deterministic fallback pitch.
  #
  # Two measurements on the live stack, of two different populations — quoting one as if it
  # bounded the other is what made them look contradictory:
  #   * IN PROCESS, one store (gaiaherbs) driven through AgentRunner.run with a real key: the
  #     pitch 3.35–5.04 s (n=5), the same population's offer-only run 12.7 ms median (n=20).
  #     That pair, and only that pair, is where 99.67% comes from.
  #   * OVER THE WIRE, POST /v1/bid-requests against all four hosted containers: 1.97–4.73 s
  #     (n=24) — gaiaherbs 3.12–4.73, toniiq 2.05–2.76, paradiseherbs 2.16–2.51,
  #     oregonswildharvest 1.97–2.39. Lower floor than the in-process range because the
  #     in-process one is gaiaherbs alone and gaiaherbs is the slow store.
  #
  # Either way the pitch dominates the request, so this is the number that decides whether a
  # hosted store answers inside the auction window or is carried at list price (R10).
  #
  # Forwarded EMPTY rather than with a copy of the code default, which is the same convention
  # `EXCHANGE_BID_WINDOW_SECONDS` and the `RANK_W_*` block use: `copywriter.py` already holds
  # both numbers, and a second spelling here is a second source of truth that stops agreeing
  # with it the first time either is tuned. Empty is not "off" — both resolvers read an empty
  # string as unset and answer with the documented default.
  STORE_AGENT_PITCH_TIMEOUT_SECONDS: "${STORE_AGENT_PITCH_TIMEOUT_SECONDS:-}"
  # What the agent still needs AFTER the model answers — screen the prose, assemble the Bid,
  # serialise it, get the bytes on the wire — plus margin for clock skew between the exchange's
  # container and this one, since `respond_by` is an absolute instant compared against this
  # container's clock.
  STORE_AGENT_PITCH_RESERVE_SECONDS: "${STORE_AGENT_PITCH_RESERVE_SECONDS:-}"

# The half every hosted agent shares: one image, one container port, one policy about what
# this image may read. Defined as a compose extension field (`x-`) BEFORE `services:` so the
# frozen textual compose parser in `.swarm-loop/acceptance/test_spec_criteria.py`, which stops
# at the first column-0 key after `services:`, still reads the service list whole.
x-store-agent-base: &store-agent-base
  build:
    # Relative to THIS file's directory, so the context is the repo root.
    context: ../..
    dockerfile: packages/store-agent/Dockerfile
  # No depends_on: an agent opens no socket of its own and touches no datastore. It waits to
  # be dialled by the exchange, and a dependency on postgres or redis here would be decoration.
  healthcheck:
    # ⚠️ Still only "the process is up" — see the warning below. The honest check that a store
    # can bid is one real POST /v1/bid-requests, which the runbook does.
    test: ["CMD", "python", "-c",
           "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8086/openapi.json').status==200 else 1)"]
    interval: 10s
    timeout: 5s
    retries: 6
    start_period: 10s
  mem_limit: 256m       # D10
  stop_grace_period: 10s
  restart: unless-stopped
  # `demo` on every hosted agent, so the default `docker compose up` is the same lean stack it
  # always was and `--profile demo` is what turns the market on. Four extra containers is 1 GiB
  # of cap against a measured ~4.85 GiB of headroom, which is affordable when asked for and
  # wasteful when not.
  profiles: ["demo"]

services:
  store-agent:
    build:
      # Relative to THIS file's directory, so the context is the repo root.
      context: ../..
      dockerfile: packages/store-agent/Dockerfile
    # D40: env-overridable. 8086 continues the 808x block after ingest's 8085.
    ports:
      - "${STORE_AGENT_PORT:-8086}:8086"
    environment:
      <<: *store-agent-llm
      PROXYSHOP_WORKER: "${PROXYSHOP_WORKER:-1}"
      # Unset by default, and deliberately: a default path would point at a store this
      # deployment never approved. See the header for what happens with them unset.
      STORE_AGENT_CONTEXT: "${STORE_AGENT_CONTEXT:-}"
      STORE_AGENT_STORE_DOMAIN: "${STORE_AGENT_STORE_DOMAIN:-}"
    # No depends_on: the shipped closure opens no socket and touches no datastore. Adding a
    # postgres/redis dependency here would be decoration, and would make this container wait
    # on services it never speaks to.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8086/openapi.json').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m       # D10
    stop_grace_period: 10s
    restart: unless-stopped

  # ── THE FOUR HOSTED STORE AGENTS ────────────────────────────────────────────────────────
  # Real storefronts out of `fixtures/real-catalogs/`, one container each. Their contexts are
  # generated by `scripts/build_demo_deployment.py` and tracked in `deploy/demo/store-contexts/`
  # — each carries that store's whole priced catalogue (not just the lead product: an agent
  # whose catalogue lacks the `product_ref` the graph rostered declines `no_matching_product`,
  # which would read as "this store does not stock it" when the truth is "this file was
  # trimmed"), an approved envelope naming the one intent cluster the exchange's deployment
  # document defines, and per-product live state.
  #
  # The other six storefronts in the corpus get NO agent, and that is the point rather than a
  # shortcut: the exchange still finds them in the graph and still rosters them, nobody answers
  # their bid door, and `collect_bids` represents each at its catalogue list price. Both halves
  # of R10 are on screen in one run — a store that bids and a store that is spoken for.

  store-agent-gaiaherbs:
    <<: *store-agent-base
    # 111 products; the corpus's most claim-rich storefront, and the one the liver-support
     # query leads with.
    ports:
      - "${STORE_AGENT_GAIAHERBS_PORT:-8090}:8086"
    volumes:
      # The whole directory read-only rather than the one file, so a regenerated corpus does
      # not need the mount rewritten. The env var below is what picks this store out of it.
      - ../../deploy/demo/store-contexts:/srv/store-contexts:ro
    environment:
      <<: *store-agent-llm
      PROXYSHOP_WORKER: "${PROXYSHOP_WORKER:-1}"
      # The document names `store_id` and `store_domain` itself; the domain is repeated here
      # because `solicitation.serving` reads the env var when the context states none, and a
      # store with no domain emits no `checkout_url` and is dropped from every shortlist by
      # the exchange's C10 check.
      STORE_AGENT_CONTEXT: /srv/store-contexts/gaiaherbs.com.json
      STORE_AGENT_STORE_DOMAIN: gaiaherbs.com

  store-agent-toniiq:
    <<: *store-agent-base
    # 103 products, and the deepest approved discount depth of the four (20%), so the
     # ranker's `discount` term has something to separate.
    ports:
      - "${STORE_AGENT_TONIIQ_PORT:-8091}:8086"
    volumes:
      # The whole directory read-only rather than the one file, so a regenerated corpus does
      # not need the mount rewritten. The env var below is what picks this store out of it.
      - ../../deploy/demo/store-contexts:/srv/store-contexts:ro
    environment:
      <<: *store-agent-llm
      PROXYSHOP_WORKER: "${PROXYSHOP_WORKER:-1}"
      # The document names `store_id` and `store_domain` itself; the domain is repeated here
      # because `solicitation.serving` reads the env var when the context states none, and a
      # store with no domain emits no `checkout_url` and is dropped from every shortlist by
      # the exchange's C10 check.
      STORE_AGENT_CONTEXT: /srv/store-contexts/toniiq.com.json
      STORE_AGENT_STORE_DOMAIN: toniiq.com

  store-agent-paradiseherbs:
    <<: *store-agent-base
    # 90 products, the shallowest depth (12%): a store that competes on trust rather than
     # on price.
    ports:
      - "${STORE_AGENT_PARADISEHERBS_PORT:-8092}:8086"
    volumes:
      # The whole directory read-only rather than the one file, so a regenerated corpus does
      # not need the mount rewritten. The env var below is what picks this store out of it.
      - ../../deploy/demo/store-contexts:/srv/store-contexts:ro
    environment:
      <<: *store-agent-llm
      PROXYSHOP_WORKER: "${PROXYSHOP_WORKER:-1}"
      # The document names `store_id` and `store_domain` itself; the domain is repeated here
      # because `solicitation.serving` reads the env var when the context states none, and a
      # store with no domain emits no `checkout_url` and is dropped from every shortlist by
      # the exchange's C10 check.
      STORE_AGENT_CONTEXT: /srv/store-contexts/paradiseherbs.com.json
      STORE_AGENT_STORE_DOMAIN: paradiseherbs.com

  store-agent-oregonswildharvest:
    <<: *store-agent-base
    # 189 products, the widest catalogue here — the store most likely to hold whatever the
     # graph rosters.
    ports:
      - "${STORE_AGENT_OREGONSWILDHARVEST_PORT:-8093}:8086"
    volumes:
      # The whole directory read-only rather than the one file, so a regenerated corpus does
      # not need the mount rewritten. The env var below is what picks this store out of it.
      - ../../deploy/demo/store-contexts:/srv/store-contexts:ro
    environment:
      <<: *store-agent-llm
      PROXYSHOP_WORKER: "${PROXYSHOP_WORKER:-1}"
      # The document names `store_id` and `store_domain` itself; the domain is repeated here
      # because `solicitation.serving` reads the env var when the context states none, and a
      # store with no domain emits no `checkout_url` and is dropped from every shortlist by
      # the exchange's C10 check.
      STORE_AGENT_CONTEXT: /srv/store-contexts/oregonswildharvest.com.json
      STORE_AGENT_STORE_DOMAIN: oregonswildharvest.com
