# Compose fragment included by the root docker-compose.yml. Created by T-000 as a valid
# empty stub so the root file's `include:` list is static from day one and no worker ever
# edits it (B6(ii)). Owner: the buyer lane.
#
# The buyer web app and its svc API — C1's first of four separate deployables.
#
# TWO services now. The paragraph this replaces said `apps/buyer/app/` was "a TypeScript
# scaffold with no build script and no entrypoint of its own... nothing there to containerise
# yet", and promised that "when it grows a build it becomes a second service in THIS fragment,
# named `buyer-web`". It grew the build a while ago — `apps/buyer/package.json` has
# `build:ui`, vite writes a real bundle to `apps/buyer/dist/` — and the promise had not been
# kept, so the only thing serving that bundle anywhere was the devstack launcher. `buyer-web`
# is at the bottom of this file, it carries the `demo` profile, and the API keeps this name.
services:
  buyer-svc:
    build:
      # Relative to THIS file's directory, so the context is the repo root.
      context: ../..
      dockerfile: apps/buyer/Dockerfile
    ports:
      - "${BUYER_SVC_PORT:-8081}:8081"      # D40: env-overridable
    environment:
      PROXYSHOP_WORKER: "${PROXYSHOP_WORKER:-1}"
      # The vault role is the buyer's alone (D5): the pseudonym mapping is the one table the
      # exchange must never be able to read, and the separation starts with the credential.
      # T-112 makes PROXYSHOP_ROLE_PASSWORD the ONE source of truth for the four
      # least-privilege role passwords, so NO password is written here. The interpolation
      # these lines replace was `${PROXYSHOP_ROLE_PASSWORD:-}`, whose empty default is what
      # made the documented `cp .env.example .env` path unserviceable: an explicitly EMPTY
      # password is not the same thing as no password, and libpq rejects it before it
      # reaches the server. THIS service is where that was first measured, in its own log:
      #
      #     psycopg.OperationalError: connection failed: connection to server at
      #     "172.27.0.3", port 5432 failed: fe_sendauth: no password supplied
      #
      # while `docker compose ps` reported this container `(healthy)` and
      # `POST /buyer/auth/magic-link` answered 500. The password is now resolved at container
      # start by the `command:` below, through proxyshop_support.postgres.role_dsn.
      PROXYSHOP_PG_DSN_VAULT: "postgresql://buyer_vault@postgres:5432/proxyshop_w${PROXYSHOP_WORKER:-1}"
      PROXYSHOP_PG_DSN_APP: "postgresql://app@postgres:5432/proxyshop_w${PROXYSHOP_WORKER:-1}"
      PROXYSHOP_ROLE_PASSWORD: "${PROXYSHOP_ROLE_PASSWORD:-}"
      # NO REDIS_URL, and no `depends_on: redis` below — see the note in
      # apps/trust/compose.yaml. Measured the same way: `git grep -n "REDIS_URL\|worker_redis"
      # -- apps/buyer/svc/src` returns nothing at all, so this service never opened a Redis
      # connection and the dependency only made the container wait on a store it never used.
      LLM_PROVIDER: "${LLM_PROVIDER:-double}"                    # D19: offline by default
      # ...and `anthropic` is now a REAL choice here. This block used to say the opposite —
      # "it has to STAY `double` in THIS container: the image installs no `anthropic` SDK …
      # a key here would advertise a live path this image cannot take" — and that was true
      # until `apps/buyer/Dockerfile:103` added `RUN pip install "anthropic==1.2.0"`. With the
      # SDK absent, `LLM_PROVIDER=anthropic` did NOT fail loudly: `AnthropicLLM.__init__` does
      # no I/O, so the selection succeeded and the ImportError surfaced only on the first
      # `complete()`, where `compose_case` caught it and served the deterministic fallback at
      # 200 OK — a container reporting healthy, configured for a live model, and writing none.
      #
      # So the key is forwarded now, and forwarding it is what makes the setting honest: with
      # `LLM_PROVIDER=anthropic` and no key, `packages/llm` raises a legible MissingApiKeyError
      # naming ANTHROPIC_API_KEY instead of quietly answering with the double. Empty is the
      # default and is the offline stack; put a real key in `.env`, never in `.env.example`.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Model ids are config, not code (C4), and each is written in exactly THREE places that
      # are pinned to each other: `packages/llm/src/config.py`'s DEFAULT_* constants,
      # `.env.example`, and these lines. `test_the_documented_defaults_are_the_values_env_
      # example_ships` gates the first two. All three move together, or none do.
      BUYER_MODEL: "${BUYER_MODEL:-claude-sonnet-5}"
      INTERVIEW_MODEL: "${INTERVIEW_MODEL:-claude-opus-5}"
      # The exchange is reached by service name inside the network, never by localhost.
      EXCHANGE_URL: "${EXCHANGE_URL:-http://exchange:8083}"
      TRUST_URL: "${TRUST_URL:-http://trust:8084}"
      # WHERE THE EXCHANGE IS, and WHO COMPETES. `EXCHANGE_URL` above is the LOWEST of the
      # three rungs `buyer_svc.composition._stated_deployment` resolves — a bare origin with
      # no roster around it — so a stack configured by that line alone opens every auction
      # over an EMPTY candidate set. These four are the other rungs, and until now they were
      # in no compose fragment and no `.env.example`: `composition.py` was built and tested
      # and the repository's own deployment could not reach any of it.
      #
      # BUYER_DEPLOYMENT is a path INSIDE the container, so a file one has to be mounted —
      # and one now is, by the `volumes:` block below. BUYER_DEPLOYMENT_JSON is the same
      # document inline and needs no mount; the path outranks it. BUYER_ROSTER /
      # BUYER_ROSTER_JSON carry the roster ALONE (data, not settings), read only when the
      # document states none.
      #
      # THE TWO PATHS NOW DEFAULT TO REAL DOCUMENTS, and the volume below puts them there.
      #
      # All four used to default to EMPTY, which is exactly unset — every reader is
      # `str(environ.get(...) or "").strip()`. That is a coherent posture for a buyer nobody
      # has configured and it was the only posture available, because no example deployment
      # document existed anywhere in the repository to point these at. There is one now:
      # `deploy/demo/` is generated by `scripts/build_demo_deployment.py` from the ten real
      # storefronts in `fixtures/real-catalogs/`, and a stack that ships eleven services and
      # nothing to configure them with is unserviceable rather than safe.
      #
      # The ROSTER is a separate file rather than a `roster` key inside the document, and
      # that is the shape `buyer_svc.composition` asks for: the document is capped at 64 KiB
      # and the roster at 512 KiB, and the document's own key would outrank this file if it
      # carried one — so it deliberately does not.
      #
      # Both stay fully overridable, and setting either to EMPTY restores the unconfigured
      # buyer whose confirmations are 503. The _JSON variants carry the same documents inline
      # for a deployment that wants no mount; the paths outrank them, so they stay empty here
      # rather than shadowing the files. A NAMED-but-unreadable path is refused, loudly.
      BUYER_DEPLOYMENT: "${BUYER_DEPLOYMENT:-/srv/deploy/buyer-deployment.json}"
      BUYER_DEPLOYMENT_JSON: "${BUYER_DEPLOYMENT_JSON:-}"
      BUYER_ROSTER: "${BUYER_ROSTER:-/srv/deploy/buyer-roster.json}"
      BUYER_ROSTER_JSON: "${BUYER_ROSTER_JSON:-}"
      # The store-scoped bearers for `GET /buyer/store-window`, and this line is the whole
      # reason that route was reachable by nobody. It shipped closed-by-default — correctly,
      # a door onto the buyer population must not open itself — and then NOTHING OPENED IT:
      # the variable appeared in exactly three files repo-wide (the route that reads it, the
      # OpenAPI document, and the README), was forwarded by 0 of 17 services across 10
      # compose files, and named in no runbook, script or Makefile target. Served in a clean
      # environment it answered `503 store-window-not-configured` everywhere it ran.
      #
      # Same shape as MERCHANT_ADMIN_TOKEN, and the same remedy: a dev token in a tracked
      # deploy file, so the demo exercises the door the tests exercise. The `deploy/demo`
      # mount below already covers the path; no new mount.
      #
      # Blanking it is a legitimate deployment: unlike the merchant admin API, this window is
      # optional, so a stack that serves nobody through it must still be HEALTHY. That is why
      # no `--require-env` clause joins the healthcheck.
      PROXYSHOP_BUYER_STORE_WINDOW_TOKENS: "${PROXYSHOP_BUYER_STORE_WINDOW_TOKENS:-/srv/deploy/buyer-store-window-tokens.json}"
      PROXYSHOP_BUYER_STORE_WINDOW_K: "${PROXYSHOP_BUYER_STORE_WINDOW_K:-}"
      # NO BUYER_UI_DIST, deliberately. `composition.mount_ui` is its only reader and this
      # container never calls it: the CMD is `uvicorn buyer_svc.main:app`, and `main.py`
      # mounts `<feature>/routes.py` routers and nothing else. Only `apps/buyer/devstack/
      # run.py` calls `mount_ui`, and that launcher sets the variable itself from the vite
      # build (run.py:488). Setting it here would serve nothing and say otherwise.
      # R5 magic-link sign-in. With these unset the auth routes answer a deliberate 503
      # and the journey page shows the service's own words, rather than failing blankly.
      #
      # _BASE_URL must be the buyer UI's ORIGIN ROOT, not a sub-path: the page reads the
      # token off its own `?token=` query string, there is no server-side callback route,
      # and the static mount has no SPA fallback — so a sub-path base URL 404s before the
      # page ever loads and the mailed link is dead.
      #
      # ⚠️ WHICH TRANSPORT, AND WHAT THE WRONG ONE COSTS. This line did not exist, so the
      # variable was NOT FORWARDED INTO THE CONTAINER AT ALL: an operator following
      # `docs/demo/shopper-demo.md`, which tells them to
      # `export PROXYSHOP_BUYER_MAGIC_LINK_TRANSPORT=console`, had that export silently
      # dropped at the container boundary and got the fail-closed 503 with nothing saying why.
      # The same drop applied to `smtp`. Forwarding it is what makes either choice reachable
      # from a compose deployment.
      #
      #   smtp     mail the link. Set _SMTP_URL, _SENDER and the credential below.
      #   console  PRINT the link, TOKEN AND ALL, to this container's stdout — i.e. into
      #            `docker compose logs buyer-svc`. The token is a live single-use bearer
      #            credential, so ANYONE WHO CAN READ THIS SERVICE'S LOG CAN SIGN IN AS ANY
      #            ADDRESS THEY TYPE: they request a link for someone else's address, read
      #            the token out of the log and redeem it. On a laptop that log is one
      #            terminal belonging to the person who is also the buyer. On a hosted
      #            droplet it is a complete authentication bypass for every shopper account,
      #            and it stays one for as long as the log is retained. Local demo only.
      #
      # Blank is neither: the deliberate 503. The service prints a banner at boot when
      # `console` is set, so `docker compose logs buyer-svc | head` says which one is running.
      PROXYSHOP_BUYER_MAGIC_LINK_TRANSPORT: "${PROXYSHOP_BUYER_MAGIC_LINK_TRANSPORT:-}"
      PROXYSHOP_BUYER_MAGIC_LINK_SMTP_URL: "${PROXYSHOP_BUYER_MAGIC_LINK_SMTP_URL:-}"
      PROXYSHOP_BUYER_MAGIC_LINK_SENDER: "${PROXYSHOP_BUYER_MAGIC_LINK_SENDER:-}"
      # The SMTP credential, forwarded from the host environment and NEVER written here — a
      # compose file is tracked, and a password in it is a password in the repository. Export
      # them in the shell that runs `docker compose up`, or hand them in through a secret.
      # Both or neither: half a credential is a boot failure rather than a 535 nobody can
      # read. The password is used byte for byte, so a trailing newline is a real character.
      PROXYSHOP_BUYER_MAGIC_LINK_SMTP_USERNAME: "${PROXYSHOP_BUYER_MAGIC_LINK_SMTP_USERNAME:-}"
      PROXYSHOP_BUYER_MAGIC_LINK_SMTP_PASSWORD: "${PROXYSHOP_BUYER_MAGIC_LINK_SMTP_PASSWORD:-}"
      # `required` (the default when blank) or `disabled`. Blank gets you TLS: it is turning
      # encryption OFF that has to be named, and a near miss like `off` is a boot failure.
      # `disabled` is for a sink on the same host; against anything else it puts every
      # sign-in token on the wire in the clear and the service says so at boot in a banner.
      PROXYSHOP_BUYER_MAGIC_LINK_SMTP_STARTTLS: "${PROXYSHOP_BUYER_MAGIC_LINK_SMTP_STARTTLS:-}"
      # Extra CAs for an MTA no public CA issued for, as a path INSIDE the container — so a
      # PEM on the host has to be bind-mounted before this can name it. Added to the system
      # trust store, never replacing it. Blank for every hosted provider.
      PROXYSHOP_BUYER_MAGIC_LINK_SMTP_CA_BUNDLE: "${PROXYSHOP_BUYER_MAGIC_LINK_SMTP_CA_BUNDLE:-}"
      # The origin root of the page a shopper opens, which under this stack is `buyer-web`
      # below and not this service: `buyer-svc` serves the API and never mounts the bundle
      # (see the BUYER_UI_DIST note above), so a link pointing here lands on a 404 and the
      # sign-in dies before the SPA loads. Still the ORIGIN ROOT, never a sub-path.
      #
      # ⚠️ THE DEFAULT BELOW IS EASILY OVERRIDDEN, AND ON THE DOCUMENTED PATH IT IS.
      # `.env.example` sets this variable outright, so an operator who follows
      # `cp .env.example .env` and sources it gets THAT value in this container no matter
      # what this line says. It now ships `http://localhost:8080/`, which agrees with the
      # default here, and the two must be kept in step -- this note used to say `.env.example`
      # carried 8081 (buyer-svc's port, from before a separate web container existed) and
      # that an operator therefore had to re-export the variable by hand after sourcing
      # `.env`. That is no longer true and the workaround is no longer needed.
      #
      # It is still worth checking rather than assuming: an operator's OWN `.env`, copied
      # before the fix, may still carry 8081, and a link pointing at 8081 reaches the API,
      # which serves no page. `docker exec proxyshop-buyer-svc-1 env | grep MAGIC_LINK` is
      # what settles it, and `docs/demo/shopper-demo.md` says so where an operator will hit it.
      PROXYSHOP_BUYER_MAGIC_LINK_BASE_URL: "${PROXYSHOP_BUYER_MAGIC_LINK_BASE_URL:-http://localhost:${BUYER_WEB_PORT:-8080}/}"
    volumes:
      # `../../`: a relative bind source in an included fragment resolves against THIS
      # file's directory, exactly as `build.context: ../..` does. See the longer note in
      # apps/exchange/compose.yaml for what `./` did instead.
      - ../../deploy/demo:/srv/deploy:ro     # read-only; see BUYER_DEPLOYMENT above
    depends_on:
      postgres:
        condition: service_healthy
    # Resolve the DSNs through the single source of truth, then exec the image's own CMD.
    # The uvicorn line MIRRORS apps/buyer/Dockerfile's CMD — compose clears the image CMD
    # when it overrides the command, so it has to be repeated, and
    # proxyshop_support/tests/test_deploy_readiness.py pins the two together.
    command: ["python", "-m", "proxyshop_support.service_launch", "serve", "--",
              "uvicorn", "buyer_svc.main:app", "--host", "0.0.0.0", "--port", "8081", "--workers", "1"]
    # READINESS, not liveness — see the long note in apps/trust/compose.yaml.
    # `buyer_vault` is the role `auth/routes.py:_vault_from_env` actually connects as, and
    # `vault.pseudonym_history` is the one table it reads and writes (vault/store.py:146), so
    # this probe fails in exactly the two states that used to read as healthy: no resolvable
    # credential, and a database with no migrations applied.
    healthcheck:
      test: ["CMD", "python", "-m", "proxyshop_support.service_launch", "ready",
             "--http-port", "8081", "--postgres", "buyer_vault:vault.pseudonym_history"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m       # D10
    stop_grace_period: 10s
    restart: unless-stopped

  # THE SPA, FINALLY SERVED BY SOMETHING. `docs/deploy.md` recorded the gap in its own words:
  # "the built SPA is served by the buyer app in the devstack launcher, and no fragment
  # publishes it as `buyer-web`." This is that service, and the name is the one the header of
  # this file reserved for it.
  #
  # WHY A SEPARATE SERVICE AND NOT `mount_ui` ON buyer-svc — the choice the deploy lane was
  # asked to make and justify, so the reasoning is here rather than in a commit message:
  #
  #   1. `mount_ui` IS NOT REACHABLE FROM THIS CONTAINER. The image's CMD is
  #      `uvicorn buyer_svc.main:app`; `apps/buyer/svc/src/main.py` is frozen (B6(iii)),
  #      builds the app at import, mounts `<feature>/routes.py` routers by glob and has no
  #      hook. `composition.mount_ui`'s own docstring says "Called by nobody in this module."
  #      Its only caller is `apps/buyer/devstack/run.py`. Reaching it would mean a new ASGI
  #      entrypoint module AND a matching edit to `apps/buyer/Dockerfile`'s CMD — the two are
  #      pinned together by `proxyshop_support/tests/test_deploy_readiness.py` — i.e. a code
  #      and image change inside the buyer service to serve a static directory.
  #   2. `StaticFiles(html=True)` HAS NO SPA FALLBACK. It answers `/` with index.html and
  #      404s every other non-file path. `apps/buyer/compose.yaml` and `.env.example` both
  #      already carry the scar: the magic-link base URL "must be the buyer UI's ORIGIN ROOT,
  #      not a sub-path", because a sub-path 404s before the page ever loads. nginx's
  #      `try_files $uri $uri/ /index.html` is the fallback that mount cannot have.
  #   3. SAME ORIGIN IS NON-NEGOTIABLE AND THIS KEEPS IT. Every endpoint in `apps/buyer/app`
  #      is a bare relative path fetched with a plain `fetch`, and `main.py` installs no CORS
  #      middleware — so a static server on its own port would break every call. This service
  #      is not a static server: `deploy/buyer-web/nginx.conf` proxies `/buyer/` to
  #      `buyer-svc:8081`, so the page and the API share one origin exactly as they do under
  #      the devstack.
  #
  # So: the API image keeps serving the API (which is what its own comment above says it
  # should), the SPA gets real routing, and nothing frozen has to move.
  buyer-web:
    build:
      # Relative to THIS file's directory, so the context is the repo root — the SPA is an npm
      # workspace member and cannot resolve `@proxyshop/contracts` from `apps/buyer` alone.
      context: ../..
      dockerfile: apps/buyer/Dockerfile.web
    # This used to be `image: nginx:1.27-alpine` with `apps/buyer/dist` bind-mounted, and
    # T-313 caught it: every service in an included fragment must build from a first-party
    # Dockerfile, because a bare `image:` deploys a container that runs none of the
    # component's code. A bind-mounted bundle is that same failure — the image holds no
    # bundle, so it runs on exactly one machine, the one whose filesystem has the artefact.
    # The bundle is built into the image now, which also retires the `make demo-ui` step and
    # the fresh-clone 403 that came from mounting a gitignored directory.
    profiles: ["demo"]
    ports:
      - "${BUYER_WEB_PORT:-8080}:8080"      # D40: env-overridable
    depends_on:
      buyer-svc:
        condition: service_healthy
    # Liveness is honestly the whole of it here, and unusually that is not a hedge: this
    # container holds no datastore credential and opens no connection of its own. What the
    # probe DOES prove past "the process is up" is that the bundle is really mounted — it
    # fetches `/` through the same `try_files` a shopper hits, so an unbuilt or empty
    # `apps/buyer/dist` is a red container instead of a blank page.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    mem_limit: 64m        # D10: nginx serving a few hundred KB of static assets
    stop_grace_period: 5s
    restart: unless-stopped
