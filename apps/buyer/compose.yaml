# Compose fragment included by the root docker-compose.yml. Created by T-000 as a valid
# empty stub so the root file's `include:` list is static from day one and no worker ever
# edits it (B6(ii)). Owner: the buyer lane.
#
# The buyer web app and its svc API — C1's first of four separate deployables.
#
# Only the svc API is a container today. apps/buyer/app/ is a TypeScript scaffold with no
# build script and no entrypoint of its own (two .ts files and four route directories), so
# there is nothing there to containerise yet; when it grows a build it becomes a second
# service in THIS fragment, named `buyer-web`, and the API keeps this name.
services:
  buyer-svc:
    build:
      # Relative to THIS file's directory, so the context is the repo root.
      context: ../..
      dockerfile: apps/buyer/Dockerfile
    ports:
      - "${BUYER_SVC_PORT:-8081}:8081"      # D40: env-overridable
    environment:
      PROXYSHOP_WORKER: "${PROXYSHOP_WORKER:-1}"
      # The vault role is the buyer's alone (D5): the pseudonym mapping is the one table the
      # exchange must never be able to read, and the separation starts with the credential.
      # T-112: PROXYSHOP_ROLE_PASSWORD is the ONE source of truth for the four
      # least-privilege role passwords, so it is interpolated INTO the DSN rather than
      # defaulted here. The default is deliberately EMPTY and not `:-x` for exactly the
      # reason the postgres service in the root file gives: a value here would be a second
      # copy of the dev password, and a second copy is a copy that stops agreeing with the
      # cluster. Set it in the environment (or .env) before `docker compose up` — a
      # password-less DSN reaches postgres and then sits in a 30s pool timeout, which is
      # what an unset variable looked like the first time this was run.
      PROXYSHOP_PG_DSN_VAULT: "postgresql://buyer_vault:${PROXYSHOP_ROLE_PASSWORD:-}@postgres:5432/proxyshop_w${PROXYSHOP_WORKER:-1}"
      PROXYSHOP_PG_DSN_APP: "postgresql://app:${PROXYSHOP_ROLE_PASSWORD:-}@postgres:5432/proxyshop_w${PROXYSHOP_WORKER:-1}"
      PROXYSHOP_ROLE_PASSWORD: "${PROXYSHOP_ROLE_PASSWORD:-}"
      REDIS_URL: "redis://redis:6379"                            # D39: no db component
      LLM_PROVIDER: "${LLM_PROVIDER:-double}"                    # D19: offline by default
      BUYER_MODEL: "${BUYER_MODEL:-claude-sonnet-4-5}"
      INTERVIEW_MODEL: "${INTERVIEW_MODEL:-claude-opus-4-1}"
      # The exchange is reached by service name inside the network, never by localhost.
      EXCHANGE_URL: "${EXCHANGE_URL:-http://exchange:8083}"
      TRUST_URL: "${TRUST_URL:-http://trust:8084}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # /openapi.json — see the note in apps/exchange/compose.yaml.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/openapi.json').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m       # D10
    stop_grace_period: 10s
    restart: unless-stopped
