# Compose fragment included by the root docker-compose.yml. Created by T-000 as a valid
# empty stub so the root file's `include:` list is static from day one and no worker ever
# edits it (B6(ii)). Owner: the trust lane.
#
# The trust-ledger API service — C1's fourth of four separate deployables.
#
# It runs the FROZEN entrypoint apps/trust/src/main.py (`trust.main:app`), which globs
# apps/trust/src/*/routes.py at import time, so a new ledger route needs a rebuild, not an
# edit here.
services:
  trust:
    build:
      # Relative to THIS file's directory, so the context is the repo root.
      context: ../..
      dockerfile: apps/trust/Dockerfile
    ports:
      - "${TRUST_PORT:-8084}:8084"      # D40: env-overridable
    environment:
      PROXYSHOP_WORKER: "${PROXYSHOP_WORKER:-1}"
      # T-112 makes PROXYSHOP_ROLE_PASSWORD the ONE source of truth for the four
      # least-privilege role passwords, so NO password is written here — not the dev literal,
      # and (since the deploy lane's readiness work) not an interpolation of the variable
      # either. These DSNs carry a user and a database and nothing else.
      #
      # The interpolation they replace was `${PROXYSHOP_ROLE_PASSWORD:-}`, and its empty
      # default is what made `cp .env.example .env` produce a stack that could not serve.
      # `.env.example` documents leaving the variable unset, so the DSN compose actually
      # built was `postgresql://trust_rw:@postgres:5432/proxyshop_w1` — and an EXPLICITLY
      # EMPTY password is not the same thing as no password. libpq rejects it before it
      # reaches the server. Measured, from `docker compose logs`:
      #
      #     psycopg.OperationalError: connection failed: ... fe_sendauth: no password supplied
      #
      # The password is instead resolved at container start by the `command:` below, through
      # proxyshop_support.postgres.role_dsn — the one function on the connect side that knows
      # how ($PROXYSHOP_ROLE_PASSWORD > the password in the DSN > DEV_ROLE_PASSWORD), and the
      # one the T-112 tests pin against db/init/00-roles.sql's coalesce(). Setting
      # PROXYSHOP_ROLE_PASSWORD still overrides everything, exactly as documented; the
      # difference is that leaving it unset now yields a cluster this container can reach.
      #
      # PROXYSHOP_LEDGER_DSN is deliberately GONE. trust/events/pg.py's DEFAULT_DSN_ENV is
      # ("PROXYSHOP_LEDGER_DSN", "PROXYSHOP_PG_DSN_TRUST_RW", "PROXYSHOP_PG_DSN_APP"), so it
      # would win — and it is not one of the role variables `serve` resolves, which would put
      # the un-resolvable spelling back in front of the resolvable one. pg.py's own docstring
      # calls it "the workaround that bug forced ... now free to drop". Dropping it leaves
      # PROXYSHOP_PG_DSN_TRUST_RW first, which names the same role D5 grants the ledger.
      PROXYSHOP_PG_DSN_TRUST_RW: "postgresql://trust_rw@postgres:5432/proxyshop_w${PROXYSHOP_WORKER:-1}"
      PROXYSHOP_PG_DSN_APP: "postgresql://app@postgres:5432/proxyshop_w${PROXYSHOP_WORKER:-1}"
      PROXYSHOP_ROLE_PASSWORD: "${PROXYSHOP_ROLE_PASSWORD:-}"
      # R13's address book: a JSON object {store_id: base_url} naming where each store's
      # agent receives its own trust deltas. Still NO wildcard and still no fallback endpoint —
      # the only alternative to an address is a guess, and a guessed address is how one store's
      # trust movement reaches a competitor, so a store absent from this map is simply not told.
      #
      # WHAT CHANGED, and why the default is no longer empty. An empty default was not a neutral
      # choice, it was the whole feature switched off in every configuration this repo ships:
      # `TRUST_STORE_AGENT_ENDPOINTS` had five repo-wide occurrences and not one of them set a
      # value, so the store agents' only learning input was dead everywhere — and nothing logged,
      # counted or health-reported that it was. D55 makes a dedicated advocate the thing a shop
      # BUYS by joining the network; an advocate that is never told what its store's score did is
      # the product's central claim, unwired.
      #
      # The default below names the four `demo`-profile agents in packages/store-agent/compose.yaml
      # by their store_id (which is their domain — see deploy/demo/store-contexts/*.json) and the
      # in-network address compose gives them, `http://<service>:8086`. `docker compose --profile
      # demo up` therefore delivers deltas with nothing exported.
      #
      # ⚠️ THE LEAN STACK, and what the boot line may and may not say about it. Without
      # `--profile demo` those four containers do not exist, so a trust event about one of those
      # stores is a delivery failure — counted, retried, and named in the undelivered ring that
      # `GET /events/verify` now serves. That is the lesser evil: a stack that says "the
      # gaiaherbs.com agent is not answering" is diagnosable and the silence it replaces was not.
      #
      # This value is ADDRESSING, never reachability, and `log_learning_loop_state` is worded to
      # say exactly that — it reads the environment and opens no socket, so it reports "4 store
      # agent(s) are ADDRESSED" and points at `GET /events/verify` for whether any of them
      # answers. An earlier wording said "deltas will be pushed to 4 store agent(s)", which in
      # this very stack was a confident falsehood printed at boot: worse than the silence it
      # replaced, because it reads as a success.
      #
      # A deployment that runs no agents at all sets TRUST_STORE_AGENT_ENDPOINTS={} and gets the
      # old behaviour with the boot WARNING saying so in as many words.
      TRUST_STORE_AGENT_ENDPOINTS: >-
        ${TRUST_STORE_AGENT_ENDPOINTS:-{"gaiaherbs.com":"http://store-agent-gaiaherbs:8086","toniiq.com":"http://store-agent-toniiq:8086","paradiseherbs.com":"http://store-agent-paradiseherbs:8086","oregonswildharvest.com":"http://store-agent-oregonswildharvest:8086"}}
      # The other half of the loop: where a completed purchase's trust movement becomes a bandit
      # outcome. `POST /internal/outcomes` on the exchange is served, published, and had NO
      # production producer anywhere in the repository — its only callers were tests and the e2e
      # harness — so `exchange.policy.bandit.update` never ran in a deployment and every posterior
      # sat on its seeded prior for the life of the process. This variable is what addresses it.
      #
      # The exchange's own container port is 8083 (apps/exchange/compose.yaml); the base url is
      # enough, `trust.feedback.notify.exchange_outcomes_url` appends the path.
      TRUST_EXCHANGE_OUTCOMES_URL: "${TRUST_EXCHANGE_OUTCOMES_URL:-http://exchange:8083}"
      # NO REDIS_URL, and no `depends_on: redis` below. Both were here and both were
      # decoration: this service never opens a Redis connection. Measured —
      # `git grep -n REDIS_URL -- apps/trust/src` is empty, and the only redis name anywhere
      # under it is `ledger/errors.py`'s `import redis.exceptions`, whose own docstring says
      # "Note what is *not* imported: no client, no connection pool, no from_url" — it names
      # exception TYPES so a psycopg-backed store can classify a transient failure.
      #
      # This is the same rule applied to apps/merchant/compose.yaml, and it is the rule this
      # lane's readiness work rests on: probe only what the service uses. A `depends_on` with
      # no probe behind it makes the container WAIT on a store it never speaks to; adding
      # `--redis` instead would have been a green light with nothing behind it. Either way it
      # is a claim the service cannot honour. proxyshop_support/tests/test_deploy_readiness.py
      # is what caught this — it requires a declared datastore dependency and a readiness
      # check that names it to land together, and it caught it in this lane's own diff.
    depends_on:
      postgres:
        condition: service_healthy
    # Resolve the DSNs through the single source of truth, then exec the image's own CMD.
    # The uvicorn line below MIRRORS apps/trust/Dockerfile's CMD — compose clears the image
    # CMD when it overrides the command, so it has to be repeated, and
    # proxyshop_support/tests/test_deploy_readiness.py pins the two together so the copy
    # cannot drift.
    command: ["python", "-m", "proxyshop_support.service_launch", "serve", "--",
              "uvicorn", "trust.main:app", "--host", "0.0.0.0", "--port", "8084", "--workers", "1"]
    # READINESS, not liveness. The probe this replaces was `/openapi.json`, which proves the
    # ASGI app imported and uvicorn is answering — and proves nothing about whether the
    # service can serve. Measured on this stack: this container reported `(healthy)` while
    # `GET /events/head` answered `503 {"error":"store_unavailable", ... PoolTimeout}`.
    #
    # `trust_rw` is the role the ledger writer authenticates as (D5), so the probe uses it
    # rather than the superuser: a probe connecting as admin stays green through a missing
    # GRANT. `ledger.commerce_events` is named because `make deps-up` creates the database
    # and applies NO migrations — without the relation check this probe passes against a
    # database holding nothing but `public`, which is the state the runbook actually produced.
    healthcheck:
      test: ["CMD", "python", "-m", "proxyshop_support.service_launch", "ready",
             "--http-port", "8084", "--postgres", "trust_rw:ledger.commerce_events"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m       # D10
    stop_grace_period: 10s
    restart: unless-stopped
