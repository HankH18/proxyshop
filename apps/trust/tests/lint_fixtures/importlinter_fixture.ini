# D35 proof configuration. Owned by T-011; never loaded by `make verify`.
#
# Deliberately a separate file from the repo's `.importlinter`: the fixture packages beside
# it must NOT be root packages of the real gate, or the real gate would go permanently red
# on a violation that exists to be violated. The test that uses this file runs
# `lint-imports --config <this file>` with this directory on PYTHONPATH and asserts the
# process exits non-zero, which is the only thing that actually demonstrates the check fires.

[importlinter]
root_packages =
    d35_exchange_fixture
    d35_sealed_fixture

[importlinter:contract:d35-fixture-forbidden]
name = D35 proof: the stand-in exchange must not import the stand-in sealed surface
type = forbidden
source_modules =
    d35_exchange_fixture
forbidden_modules =
    d35_sealed_fixture
