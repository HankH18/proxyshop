# Compose fragment included by the root docker-compose.yml. Created by T-000 as a valid
# empty stub so the root file's `include:` list is static from day one and no worker ever
# edits it (B6(ii)). Owner: the exchange lane.
#
# The exchange API service — C1's third of four separate deployables.
#
# It runs the FROZEN entrypoint apps/exchange/src/main.py (`exchange.main:app`), which globs
# apps/exchange/src/*/routes.py at import time. A feature ticket that adds a router therefore
# needs no change here: rebuild the image and the route is served.
services:
  exchange:
    build:
      # Relative to THIS file's directory, so the context is the repo root and the flat-src
      # layout (D42) can be reproduced inside the image. See ../../.dockerignore for why the
      # root context does not mean a 950 MiB upload.
      context: ../..
      dockerfile: apps/exchange/Dockerfile
    # D40: env-overridable, never hard-coded, so a second checkout can move the whole block.
    ports:
      - "${EXCHANGE_PORT:-8083}:8083"
    environment:
      # D38: the per-worker database. The DSNs point at the compose service names, not at
      # localhost — inside the network `postgres` and `redis` are the hosts, and a .env
      # copied from .env.example (which is written for the HOST side) must not leak in here.
      PROXYSHOP_WORKER: "${PROXYSHOP_WORKER:-1}"
      # T-112 makes PROXYSHOP_ROLE_PASSWORD the ONE source of truth for the four
      # least-privilege role passwords, so NO password is written here. The interpolation
      # these lines replace was `${PROXYSHOP_ROLE_PASSWORD:-}`, whose empty default produced
      # `postgresql://exchange:@postgres:5432/...` on the documented `cp .env.example .env`
      # path — and an explicitly EMPTY password is not the same thing as no password; libpq
      # rejects it before it reaches the server. The password is resolved at container start
      # by the `command:` below, through proxyshop_support.postgres.role_dsn. See the long
      # note in apps/trust/compose.yaml for the measurement.
      PROXYSHOP_PG_DSN_EXCHANGE: "postgresql://exchange@postgres:5432/proxyshop_w${PROXYSHOP_WORKER:-1}"
      PROXYSHOP_PG_DSN_APP: "postgresql://app@postgres:5432/proxyshop_w${PROXYSHOP_WORKER:-1}"
      # Forwarded as well as resolved: proxyshop_support.postgres reads this variable
      # directly when a component builds its own DSN instead of taking one from the env.
      PROXYSHOP_ROLE_PASSWORD: "${PROXYSHOP_ROLE_PASSWORD:-}"
      # D39: no database component. The logical DB index is the worker index and
      # proxyshop_support.redis_client sets it authoritatively.
      REDIS_URL: "redis://redis:6379"
      # NO LLM_PROVIDER, and its absence is measured rather than an oversight. This image
      # ships no `llm` package — `apps/exchange/Dockerfile` copies contracts, verification,
      # store_agent/external, exchange and ingest's graph/embeddings, and nothing else — and
      # no module under `apps/exchange/src` imports one (`grep -rnE "^\s*(from|import) llm\b"
      # apps/exchange/src` is empty). The line that used to stand here set a variable no
      # process in this container could read. `resolve_provider` in `exchange.checkout` is a
      # CHECKOUT provider and reads CHECKOUT_MODE below; it has nothing to do with a model.
      # Empty, not "hash": an unset value takes `ingest.embeddings.DEFAULT_PROVIDER`, so the
      # configured default lives in ONE place. Pinning "hash" here re-pinned the exchange to a
      # provider measured at 28/45 inverted relevance pairs (D56), independently of the swap.
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-}"
      # D55'S ORGANIC HALF — the graph retrieval that is the FIRST step of this product.
      #
      # `EXCHANGE_SHOP_ROSTER=graph` is the only value `retrieval/roster.py:499` accepts, and
      # until this line existed the string appeared in NO compose file, NO env file and NO
      # runbook anywhere in the repository: measured, the four occurrences were the reader
      # itself, the composition branch that calls it, and a comment in
      # `apps/exchange/Dockerfile` claiming something set it. So `GraphShopRoster` was never
      # bound in ANY deployment, `_shop_roster` installed `NoShopRoster` whose name is
      # literally "unwired", and `POST /auctions` with no roster in the request body found
      # nobody. Built, tested, and reachable by nobody.
      #
      # Defaulted ON rather than left empty, and that is a deliberate departure from the
      # empty-default rule the rest of this block follows. The rule exists to stop a compose
      # file becoming a SECOND source of truth for a value the code already defaults; this
      # variable has no code-side default that turns the feature on — unset means off, and
      # off means the organic half of the market does not exist. An operator who wants the
      # request-body roster only sets `EXCHANGE_SHOP_ROSTER=` and gets exactly the old
      # behaviour back.
      #
      # ⚠️ IT DOES NOTHING ON ITS OWN. `ensure_configured` returns early when
      # `read_deployment` finds no document, so the branch that binds the roster is never
      # reached unless EXCHANGE_DEPLOYMENT (below) also names one. The two lines are one
      # switch; splitting them is how this reads as configured and behaves as unwired.
      EXCHANGE_SHOP_ROSTER: "${EXCHANGE_SHOP_ROSTER:-graph}"
      # ...and the graph it reads. `roster.py:517-520` builds the driver from exactly these
      # three names, defaulting the URI to `bolt://localhost:7687` — the CONTAINER'S own
      # loopback, where nothing listens — so without these lines every solicitation came back
      # as an empty roster whose reason named a connection refusal. Inside the compose network
      # `neo4j` is the host; `.env.example` is written for the HOST side and must not leak in.
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-proxyshop_dev_pw}"
      # T-310. This block used to be a single `RANKING_WEIGHTS=w_m=0.35,w_e=0.20,...` and
      # NOTHING read it — measured: `git grep RANKING_WEIGHTS` outside .swarm-loop returned
      # this line and one in `.env.example` and no reader at all. `.env.example` has since
      # been corrected the same way, so the dead name is now gone from both. The loader is
      # `contracts.ranking.RankingWeights.from_env`, and `WEIGHT_ENV_VARS` (ranking.py:58-64)
      # names five SEPARATE variables — RANK_W_M/E/T/V/D — plus RANK_WEIGHTS_VERSION. So the
      # deployed exchange was silently un-tunable: a weight set written into the old variable
      # changed nothing, and the shortlist was always the published default. That mattered
      # nowhere until the ranker reached a served path; it does now.
      #
      # Defaults are deliberately EMPTY rather than the published numbers, for the same reason
      # PROXYSHOP_ROLE_PASSWORD above is: `from_env` falls back to the published set when a
      # variable is unset, so a copy of those numbers here would be a second source of truth
      # that stops agreeing with `packages/contracts` the day the published set moves. Setting
      # a malformed one, or a set that does not sum to 1.0, raises from the published loader
      # rather than defaulting silently.
      RANK_W_M: "${RANK_W_M:-}"
      RANK_W_E: "${RANK_W_E:-}"
      RANK_W_T: "${RANK_W_T:-}"
      RANK_W_V: "${RANK_W_V:-}"
      RANK_W_D: "${RANK_W_D:-}"
      RANK_WEIGHTS_VERSION: "${RANK_WEIGHTS_VERSION:-}"
      CHECKOUT_MODE: "${CHECKOUT_MODE:-redirect}"
      # The composition root (`exchange.composition`). WITHOUT these two lines the container
      # cannot be configured at all: compose forwards no host variable it does not name, so a
      # deployment that exported EXCHANGE_DEPLOYMENT would boot an exchange still holding its
      # five fail-closed defaults — eligibility with no rows, NullSolicitor, an empty trust
      # snapshot, no registered domains and no bid book — and answer every auction with
      # `ranked: []` and every accept with `unknown_bid`. That is the defect the module exists
      # to close, and an unreachable composition root closes nothing.
      #
      # `EXCHANGE_DEPLOYMENT` is a path INSIDE the container, so a file one must be mounted
      # (no volume is declared here: a deployment that wants one adds it in its own override,
      # and the image is otherwise read-only by design). `EXCHANGE_DEPLOYMENT_JSON` carries
      # the same document inline and needs no mount, which is why both are forwarded.
      #
      # THE PATH NOW DEFAULTS TO A REAL DOCUMENT, and the volume below puts it there.
      #
      # It used to default to EMPTY, on the same "a value here would be a second source of
      # truth" reasoning the RANK_W_* block above uses. That reasoning does not transfer:
      # a rank weight has a published default in `packages/contracts` and this key has none —
      # unset is not "the shipped default", it is "no sellers, no domains, no endpoints, no
      # trust snapshot and no bid book". Measured on this stack: `docker compose up -d`,
      # every row `(healthy)`, and `POST /auctions` answering `ranked: []` for every request.
      # A demo stack that ships eleven services and no document nobody can auction with is
      # not fail-closed, it is unserviceable — and NO example deployment document existed
      # anywhere in the repository to point this at.
      #
      # `deploy/demo/exchange-deployment.json` is generated by
      # `scripts/build_demo_deployment.py` from the ten real storefronts in
      # `fixtures/real-catalogs/`: ten eligible sellers whose `registered_domain` is the real
      # host, `bid_endpoint`s for the four that get a hosted agent in
      # `packages/store-agent/compose.yaml`, a stated trust snapshot, the one named intent
      # cluster those agents' envelopes pursue, and the catalogue snapshots the claim
      # verifier grades against. Nothing in it is invented except the three things no
      # storefront publishes — envelope depth, trust score, cluster vocabulary.
      #
      # Still fully overridable: export EXCHANGE_DEPLOYMENT to point somewhere else, or set
      # it EMPTY to get the unconfigured exchange back. EXCHANGE_DEPLOYMENT_JSON carries the
      # same document inline for a deployment that wants no mount; the path outranks it, so
      # it stays empty here rather than shadowing the file.
      EXCHANGE_DEPLOYMENT: "${EXCHANGE_DEPLOYMENT:-/srv/deploy/exchange-deployment.json}"
      EXCHANGE_DEPLOYMENT_JSON: "${EXCHANGE_DEPLOYMENT_JSON:-}"
    # READ-ONLY, and the only volume this image has. The container is otherwise immutable by
    # design; a deployment document is configuration the process reads once per boot.
    volumes:
      # `../../` because a relative bind source in an INCLUDED fragment resolves against
      # THIS FILE's directory, not the repo root -- the same rule `build.context: ../..`
      # above follows. Written `./deploy/demo` it silently became
      # `apps/exchange/deploy/demo`, which does not exist, and Docker answers a missing
      # bind source by CREATING an empty directory: the container then reported healthy
      # and the exchange refused every request naming an unreadable deployment path.
      - ../../deploy/demo:/srv/deploy:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # DECLARED NOW, because the graph roster above makes it true. `GraphShopRoster.solicit`
      # opens a bolt session on the first solicitation, and `POST /auctions` with no roster in
      # the body cannot answer without one. It was correct to omit while the roster was opt-in
      # and nothing opted in; it is not correct now.
      neo4j:
        condition: service_healthy
    # Resolve the DSNs through the single source of truth, then exec the image's own CMD.
    # The uvicorn line MIRRORS apps/exchange/Dockerfile's CMD — compose clears the image CMD
    # when it overrides the command, so it has to be repeated, and
    # proxyshop_support/tests/test_deploy_readiness.py pins the two together.
    command: ["python", "-m", "proxyshop_support.service_launch", "serve", "--",
              "uvicorn", "exchange.main:app", "--host", "0.0.0.0", "--port", "8083", "--workers", "1"]
    # READINESS, not liveness — see the long note in apps/trust/compose.yaml.
    #
    # `--redis` is the MEASURED dependency: `exchange/auction/state.py` holds the auction
    # state machine in a `proxyshop_support.redis_client.WorkerRedis` (D39), and the check
    # also refuses a worker index the running server cannot isolate, which is a state in
    # which no auction route can serve.
    #
    # `--postgres exchange:app.sellers` covers what this fragment DECLARES it depends on.
    # Measured honestly: `git grep -l psycopg -- apps/exchange/src` is empty today, so the
    # exchange's own closure does not open a postgres connection — but this fragment hands it
    # two DSNs and a `depends_on: postgres`, and the eligibility gate reads seller status from
    # `app.sellers`. A check that can only ever make the probe stricter is the conservative
    # side of that uncertainty; the alternative (probing nothing) is the defect being fixed.
    #
    # `--neo4j` IS HERE NOW, and the paragraph it replaces was true twice over when it was
    # written and is false twice over now. It said there was deliberately no neo4j probe
    # because `apps/exchange/Dockerfile` shipped `ingest.graph` without the `neo4j` driver,
    # so the probe would have failed on the import rather than on the datastore. Both halves
    # have since moved: `apps/exchange/Dockerfile` installs `neo4j==5.28.5` in a layer of its
    # own, and `EXCHANGE_SHOP_ROSTER` above now defaults to `graph`, so the catalogue graph is
    # on the SERVED path of every roster-less auction. An exchange that cannot open a bolt
    # session can no longer answer the organic half of `POST /auctions`, which is what
    # "ready" is supposed to mean. The pairing is also enforced: `proxyshop_support/tests/
    # test_deploy_readiness.py` fails a service that declares `depends_on: neo4j` and does
    # not probe it.
    #
    # NEO4J_PASSWORD above is load-bearing for this line, not decoration —
    # `service_launch.check_neo4j` defaults that variable to the EMPTY string, so a probe
    # without it authenticates as nobody against a server that requires a password.
    healthcheck:
      test: ["CMD", "python", "-m", "proxyshop_support.service_launch", "ready",
             "--http-port", "8083", "--postgres", "exchange:app.sellers", "--redis",
             "--neo4j"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # D10: memory is the binding constraint. One uvicorn worker holding a FastAPI app and a
    # psycopg pool measures well under this; the four service containers together add 1 GiB
    # to the datastore stack's 3.125 GiB.
    mem_limit: 256m
    stop_grace_period: 10s
    restart: unless-stopped
