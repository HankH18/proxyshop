# Compose fragment included by the root docker-compose.yml. Created by T-000 as a valid
# empty stub so the root file's `include:` list is static from day one and no worker ever
# edits it (B6(ii)). Owner: T-050.
#
# The merchant Shopify app and its svc API — C1's second of four separate deployables.
#
# ONE container, serving the API and the operator dashboard from one uvicorn — and the second
# half of that only started being true when `dockerfile:` below moved.
#
# The paragraph this replaces said "apps/merchant/app/ is a TypeScript scaffold with no build
# script and no entrypoint of its own, so there is nothing there to containerise yet; when it
# grows a build it becomes a second service in THIS fragment, named `merchant-web`." It grew
# the build; what it did NOT need was a second service. `apps/merchant/Dockerfile.web` builds
# the dashboard bundle in a node stage, copies it into the same python image, and runs the
# same `uvicorn merchant_svc.main:app` on the same port 8082 with a byte-identical CMD — so
# pointing this build at it changes what the image CONTAINS and nothing about what compose
# runs, which is why it is a one-line move rather than a new block.
#
# WHAT WAS BROKEN. `merchant_svc.dashboard.routes` mounts the dashboard at `/dashboard` and
# resolves the bundle per request from `MERCHANT_UI_DIST`. That variable was set in no compose
# fragment, no `.env.example`, no Dockerfile and no script, and `apps/merchant/app/dist` is
# both gitignored and `.dockerignore`d so it could not be COPYd from a host either — so every
# container deployment answered every `/dashboard/*` request with a 503 telling the reader to
# run a build the image had no way to run. Losses, envelope edits, the onboarding interview and
# activation approval — the whole supply side — were unreachable in compose, from a container
# reporting healthy.
#
# NO `MERCHANT_UI_DIST` HERE, deliberately. `Dockerfile.web` sets it as an `ENV` to a path that
# exists only inside the image, which is the only form of the setting that cannot be wrong;
# stating it out here would put a container-internal path in a file edited outside the
# container. `os.environ` still wins, so a deployment serving a different bundle overrides it.
services:
  merchant-svc:
    build:
      # Relative to THIS file's directory, so the context is the repo root.
      context: ../..
      dockerfile: apps/merchant/Dockerfile.web
    ports:
      - "${MERCHANT_SVC_PORT:-8082}:8082"      # D40: env-overridable
    environment:
      PROXYSHOP_WORKER: "${PROXYSHOP_WORKER:-1}"
      # NO PROXYSHOP_PG_DSN_* and NO REDIS_URL here, and no `depends_on:` either — both were
      # removed rather than repaired. This service touches no datastore at all, measured:
      #
      #     $ git grep -n "psycopg\|worker_redis\|import redis\|neo4j" -- apps/merchant/svc/src
      #     (no output)
      #
      # The offline token store is `install/tokens.py`'s in-memory dict. A DSN it never reads
      # and a `depends_on: postgres` it never needs are the same class of thing this lane is
      # here to delete: configuration that makes a service look wired to something it is not.
      # When the merchant grows a datastore, its dependency and its readiness check land in
      # this fragment together — that pairing is what `test_deploy_readiness.py` enforces.
      #
      # The install flow talks to the Shopify Admin API. In the compose stack that is the
      # stub, by service name — the stub is on the `e2e` profile, so a `docker compose up`
      # without that profile leaves this pointed at a host that is not running, which is the
      # honest state of affairs rather than a silent fallback to a live myshopify.com.
      SHOPIFY_STUB_URL: "${SHOPIFY_STUB_URL:-http://shopify-stub:8787}"
      SHOPIFY_API_KEY: "${SHOPIFY_API_KEY:-}"
      SHOPIFY_API_SECRET: "${SHOPIFY_API_SECRET:-}"
      MERCHANT_APP_URL: "${MERCHANT_APP_URL:-http://localhost:8082}"
      # Where this merchant publishes verified order webhooks as ledger events. The
      # composition root falls back to this same default, so the shipped stack works with
      # the variable unset; naming it here is what makes it OVERRIDABLE for a deployment
      # whose trust service is not the compose service. An unreachable endpoint is counted
      # and logged, never raised — a raising sink is answered 500 and Shopify retries it
      # for 48 hours.
      TRUST_URL: "${TRUST_URL:-http://trust:8084}"
      # The bearer token the administrative routes require. It appeared in NO compose
      # fragment and in NO .env.example until now, so discount-code minting and every
      # `/install/shops`, `/stores/{id}/envelope` and `/stores/{id}/kill` call was
      # unreachable in the deployment — `install/routes.py:63` reads it with no default and
      # no fallback, on purpose, so an unset value makes the route refuse every caller:
      #
      #     $ curl -s localhost:8082/install/shops
      #     {"error":"admin-api-not-configured","missing":["MERCHANT_ADMIN_TOKEN"], ...}   503
      #
      # ...answered by a container reporting `(healthy)`. The default below comes from
      # .env.example, which now ships a dev value so `cp .env.example .env` produces a
      # deployment whose admin surface is actually reachable. It is a DEV token: change it
      # anywhere the merchant API is exposed beyond a laptop.
      MERCHANT_ADMIN_TOKEN: "${MERCHANT_ADMIN_TOKEN:-}"
    # READINESS, not liveness — see the long note in apps/trust/compose.yaml. There is no
    # datastore check here because there is no datastore (measured above); what there IS, is
    # a setting whose absence turns every administrative route into a 503 while the container
    # reports healthy. That is the same lie as an unreachable database, so it is checked the
    # same way.
    healthcheck:
      test: ["CMD", "python", "-m", "proxyshop_support.service_launch", "ready",
             "--http-port", "8082", "--require-env", "MERCHANT_ADMIN_TOKEN"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    mem_limit: 256m       # D10
    stop_grace_period: 10s
    restart: unless-stopped
