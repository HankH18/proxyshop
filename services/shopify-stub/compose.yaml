# Compose fragment included by the root docker-compose.yml. Created by T-000 as a valid
# empty stub so the root file's `include:` list is static from day one and no worker ever
# edits it (B6(ii)). Owner: T-013.
#
# The shopify-stub service. When filled it MUST carry `profiles: ["e2e"]` (it is only
# used by the e2e tickets; unit tests build the stub in-process on port 0, D40) and publish
# ${SHOPIFY_STUB_PORT:-8787}:8787 to match SHOPIFY_STUB_URL in .env.example.
#
# When you fill this in: declare an explicit `mem_limit` (D10 — every service carries one;
# the datastore stack already commits 3.125 GiB of the ~4.85 GiB measured headroom), publish
# only env-overridable ports (D40), and keep the service name unique across all nine
# fragments.
services: {}
