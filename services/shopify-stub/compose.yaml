# Compose fragment included by the root docker-compose.yml. Created by T-000 as a valid
# empty stub so the root file's `include:` list is static from day one and no worker ever
# edits it (B6(ii)). Owner: T-013.
#
# The shopify-stub service. It carries `profiles: ["e2e"]` because it is only used by the
# e2e tickets: unit tests build the stub in-process on port 0 (D41), which costs no
# container RAM and gives each test its own discount-code table and pixel-drop-rate knob.
# `make deps-up` starts postgres, neo4j and redis by name and therefore never starts this.
#
# BUILT AND RUN (T-314). The warning that used to stand here told an operator this image had
# no artifact behind it yet and that the demo's step 1 would land them in the builder rather
# than in the service — while `docs/demo/starting-slice.md` sends them into exactly that
# command as step 1. It is no longer true. What was actually done, so the next reader can
# tell a real build from a deleted comment:
#
#   docker build -f services/shopify-stub/Dockerfile -t proxyshop-shopify-stub:c19 .
#       -> exit 0. 186 MB, from the locally cached python:3.12-slim; the four pinned wheels
#          were the only network fetch.
#   docker compose --profile e2e build shopify-stub
#       -> exit 0, so the `build:` stanza below resolves as written, not just as parsed.
#   docker run -d -p 18787:8787 <image>
#       -> GET /healthz 200 {"status":"ok","shop_domain":"proxyshop-demo.myshopify.com"};
#          /openapi.json serves 14 paths (11 `_stub` control routes, the Admin GraphQL door,
#          the cart permalink and /healthz).
#   inside the running container: shopify_stub.recordings.RECORDINGS_DIR resolves to
#       /app/fixtures/recorded, is_dir() True, 9 recordings loaded — the T-304 repair,
#       confirmed in the artifact rather than in a materialised copy of it.
#
# The build DOES reach the network (a base image and wheels), which is why no automated
# verify performs it: D3 forbids a verify that reaches the network, so the gate that grades
# this file is textual and this comment is the record it cannot produce for itself.
# Nothing in `pytest services/shopify-stub -q` depends on any of this.
services:
  shopify-stub:
    build:
      # Relative to THIS file's directory, so the context is the repo root and the stub's
      # source is copied in as services/shopify-stub/src.
      context: ../..
      dockerfile: services/shopify-stub/Dockerfile
    profiles: ["e2e"]
    # D40: the published port is env-overridable so a second checkout can move it. 8787 is
    # the default recorded in .env.example's SHOPIFY_STUB_URL.
    ports:
      - "${SHOPIFY_STUB_PORT:-8787}:8787"
    # NO `environment:`, and the one key that used to be here is why this note replaces it.
    # `SHOPIFY_STUB_SHOP_DOMAIN` read like the host the stub claims to be, and it set nothing:
    # the stub reads NO environment variable anywhere (`grep -rn "environ\|getenv"
    # services/shopify-stub/src` matches one docstring and no code). The domain is a
    # `StubConfig` field defaulted at `services/shopify-stub/src/state.py:32` to
    # `proxyshop-demo.myshopify.com` — the value the healthcheck's /healthz reports above —
    # and changed at runtime through the `_stub` config route, never at container start. An
    # operator who set the old variable got the default and no warning.
    # D10: memory is the binding constraint. The stub holds a few dictionaries and one
    # uvicorn worker; 128 MiB is generous for that and keeps it a rounding error against
    # the 3.125 GiB the datastore stack already commits.
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8787/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
