# Compose fragment included by the root docker-compose.yml. Created by T-000 as a valid
# empty stub so the root file's `include:` list is static from day one and no worker ever
# edits it (B6(ii)). Owner: the ingest lane. Filled by T-313.
#
# The ingest worker service. `ingest.main:app` mounts the two routers its glob finds,
# `/er` (entity resolution) and `/extraction` (policy pages and claim extraction).
services:
  ingest:
    build:
      # Relative to THIS file's directory, so the context is the repo root and the flat-src
      # layout (D42) can be reproduced inside the image. See ../../.dockerignore for why the
      # root context does not mean a 950 MiB upload.
      context: ../..
      dockerfile: services/ingest/Dockerfile
    # D40: env-overridable, never hard-coded. 8085 continues the 808x block after trust's
    # 8084; nothing else in the repo references it.
    ports:
      - "${INGEST_PORT:-8085}:8085"
    environment:
      PROXYSHOP_WORKER: "${PROXYSHOP_WORKER:-1}"
      # D19/D56: an offline, dependency-free embedding, never the local BGE model. The image
      # deliberately does not install sentence-transformers/torch (they are an optional extra
      # in the root manifest and NEVER installed by default), and embeddings/local_bge.py:93
      # defers that import into _load(), so selecting `local_bge` here would fail at first use
      # rather than at startup.
      #
      # The fallback is EMPTY, not a provider name, and that is the point. It used to read
      # `${EMBEDDING_PROVIDER:-hash}`, which duplicated the default into a second place — so
      # D56's swap of DEFAULT_PROVIDER from `hash` to `lexical` would have changed the code,
      # the tests and nothing that actually runs in compose. `get_embedding_provider` treats
      # unset and blank identically and falls through to DEFAULT_PROVIDER, so the registry in
      # `services/ingest/src/embeddings/__init__.py` is now the single source of truth and an
      # operator can still override by exporting the variable.
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-}"
      # `proxyshop_support/neo4j_auth.graph_credentials` reads these — one resolution shared by
      # the re-embedder, the exchange's roster and catalogue, and the readiness probe, which
      # used to disagree three ways about the default.
      # Inside the compose network `neo4j` is the host, not localhost — a .env copied from
      # .env.example is written for the HOST side and must not leak in here.
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-proxyshop_dev_pw}"
      # D20: the offline double unless something says otherwise. extraction/llm_extractor.py
      # builds its client through packages/llm, which defaults to the deterministic double.
      # It has to stay `double` here for the reason apps/buyer/compose.yaml states at length:
      # this image installs no `anthropic` SDK either, so the live client raises on first use.
      LLM_PROVIDER: "${LLM_PROVIDER:-double}"
      # THE SCHEDULER'S THREE VARIABLES. `main.py` globs `*/routes.py`, so `scheduler/routes.py`
      # is mounted in this image and reads all three AT IMPORT — and none of them appeared in
      # any compose fragment or in `.env.example`, so the crawler shipped with nothing to crawl.
      # All three treat a blank value as unset, so the empty defaults below are exactly the
      # unset behaviour and are safe to leave alone:
      #
      #   PROXYSHOP_INGEST_STORES  a JSON array of StoreTarget objects (store_id, base_url,
      #     source: signed_fetch|catalog_mcp, ...). UNSET = an EMPTY registry: `POST
      #     /refresh/{store_id}` answers 404 for every store and the scheduler ticks over
      #     nothing. A malformed entry is skipped, logged and does not take the service down.
      #     Environment rather than source (D41) because a hard-coded storefront URL in a
      #     crawler turns a config mistake into someone else's traffic.
      #   PROXYSHOP_INGEST_CADENCE  inline JSON (it starts with `[`) or a path to a file
      #     holding it. UNSET = the published DEFAULT_CADENCE — price/availability hourly,
      #     product fields daily, policy claims weekly — which is a working table, not a stall.
      #   PROXYSHOP_INGEST_SCHEDULER_STATE  a path for the durable schedule. UNSET = an
      #     in-memory store that RESETS ON RESTART, so the first tick after a redeploy
      #     re-crawls every configured store. The service says so in a startup warning.
      PROXYSHOP_INGEST_STORES: "${PROXYSHOP_INGEST_STORES:-}"
      PROXYSHOP_INGEST_CADENCE: "${PROXYSHOP_INGEST_CADENCE:-}"
      PROXYSHOP_INGEST_SCHEDULER_STATE: "${PROXYSHOP_INGEST_SCHEDULER_STATE:-}"
    depends_on:
      neo4j:
        condition: service_healthy
    # READINESS, not liveness — see the long note in apps/trust/compose.yaml. The probe this
    # replaces was `/openapi.json`, and its own comment ended "It does NOT prove neo4j is
    # reachable." Now it does.
    #
    # No `--postgres`: this service opens no postgres connection (`git grep -l psycopg --
    # services/ingest/src` is empty) and this fragment hands it no DSN. Neo4j is the whole of
    # its datastore surface, and `verify_connectivity` opens a real bolt session rather than
    # TCP-probing 7687 — a Neo4j that is listening but still recovering its store accepts the
    # socket and refuses the session, which is exactly the window in which this container
    # used to report healthy and fail every write.
    healthcheck:
      test: ["CMD", "python", "-m", "proxyshop_support.service_launch", "ready",
             "--http-port", "8085", "--neo4j"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    # D10: memory is the binding constraint. One uvicorn worker holding a FastAPI app and
    # the crawl adapters; no model is loaded (EMBEDDING_PROVIDER=hash above).
    mem_limit: 256m
    stop_grace_period: 10s
    restart: unless-stopped

  # THE ONE-SHOT CORPUS LOADER. `make deps-up` starts an EMPTY Neo4j, and nothing in the
  # repository ever put the ten recorded storefronts in `fixtures/real-catalogs/` into it —
  # `ingest.scheduler.load_corpus` had no make target, no script, no compose service and no
  # caller anywhere outside two tests. So the exchange's graph roster, once switched on, walked
  # a graph with no products in it and correctly found nobody.
  #
  # Its own profile, not `demo`. It runs for MINUTES (44,803 graph writes over 3,093 products)
  # and then exits, so a `--profile demo up -d --wait` that carried it would sit on a container
  # that is supposed to stop. It is invoked once, explicitly, by `make demo-corpus`.
  #
  # It is a SEPARATE service rather than a `docker compose exec` into `ingest`, for two
  # measured reasons: `ingest`'s healthcheck requires its HTTP server to be answering, so
  # replacing that container's command with the loader would make it permanently unhealthy and
  # `restart: unless-stopped` would re-run the whole load in a loop; and `ingest`'s 256 MiB cap
  # is well under what reassembling 20 MB of recorded pages and embedding in batches of 200
  # needs.
  corpus-loader:
    profiles: ["corpus"]
    build:
      context: ../..
      dockerfile: services/ingest/Dockerfile
    # ⚠️ THE MOUNT IS NOT OPTIONAL. `services/ingest/Dockerfile` copies the source, support and
    # llm packages and NOT `fixtures/`, and `adapters/recorded.default_corpus_dir()` resolves
    # the default to `/app/fixtures/real-catalogs` from its own `__file__`. Without this line
    # the loader dies on its first call with a FileNotFoundError naming that path. Read-only:
    # the corpus is a recording and the loader has no business writing to it.
    volumes:
      # `../../`: a relative bind source in an included fragment resolves against THIS
      # file's directory. `./fixtures/real-catalogs` became `services/ingest/fixtures/
      # real-catalogs`, Docker created it empty, and the loader died on a FileNotFoundError
      # naming a path that looked right.
      - ../../fixtures/real-catalogs:/app/fixtures/real-catalogs:ro
    environment:
      PROXYSHOP_WORKER: "${PROXYSHOP_WORKER:-1}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-proxyshop_dev_pw}"
      # LEAVE THIS EMPTY, and leave the exchange's empty too. Both fall through to
      # `ingest.embeddings.DEFAULT_PROVIDER` (`lexical`), and the graph query REFUSES to read
      # vectors written under a different provider than the one asking —
      # `EmbeddingProviderMismatch` comes back as an empty roster naming both names. Two
      # fragments agreeing by both saying nothing is the only way that cannot drift.
      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-}"
      LLM_PROVIDER: "${LLM_PROVIDER:-double}"
    depends_on:
      neo4j:
        condition: service_healthy
    # `--all`: every recorded store, which is what makes the graph a market rather than a
    # sample. `--no-lock`: the D37 flock is `/tmp/proxyshop-neo4j.lock` inside the CONTAINER's
    # own filesystem, so taking it here protects nothing that a host-side graph test could see
    # and only risks a wait on a lock nobody else can hold.
    command: ["python", "-m", "ingest.scheduler.load_corpus", "--all", "--no-lock",
              "--probe", "milk thistle silymarin liver support extract"]
    # NO healthcheck and `restart: "no"`: this is a job. A healthcheck on a container that is
    # supposed to exit is a contradiction, and a restart policy on one is an infinite loop.
    restart: "no"
    mem_limit: 1g
    stop_grace_period: 30s
