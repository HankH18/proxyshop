# ProxyShop CI — the GitHub mirror.
#
# The submission target is the self-hosted GitLab (labs.gauntletai.com) and its pipeline is
# `.gitlab-ci.yml`. This is the same gate on the mirror, and it is the STRONGER of the two:
# a GitHub runner is a VM with its own Docker daemon, so `docker compose` publishes on the
# job's own localhost and this job can run the repository's OWN stack — `make deps-up`,
# verbatim, the same command a developer runs. It therefore has no copy of any image tag and
# no copy of any credential, and nothing here can drift from docker-compose.yml because
# nothing here restates it.
#
# `.gitlab-ci.yml` cannot do that: a GitLab docker-executor job reaches services by alias,
# never on localhost, so compose would mean docker-in-docker and a privileged runner. It
# declares CI services instead and pays for the duplication with a drift check. The last
# step of both jobs is that check.
#
# RE-SPELLS NOTHING. The gate is `scripts/verify.sh` via `make verify` — ruff, ruff format,
# import-linter, the banned-reset gate, eslint, mypy, tsc -b, the frozen acceptance suite in
# its own interpreter with the three S8 release blockers asserted by id, ~7,600 pytest tests
# including 309 that need the datastores, vitest, the datastore coverage gate, and
# scripts/check_verify_contracts.py. Makefile and scripts/verify.sh are hash-pinned in
# .swarm-loop/manifest.json; this workflow calls them and does not touch them.
#
# NO SECRETS, NO NETWORK, NO DEPLOY. `secrets` is never read. LLM_PROVIDER is left unset so
# it keeps its default deterministic offline double, and the embedding provider keeps
# `lexical` (D56); the suite makes no outbound call. Nothing here pushes or publishes.

name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # NOT 0 — worker 0 is reserved for the frozen build_succeeds measurement, and
      # scripts/db_reclaim.py protects proxyshop_w0 under every flag. Under 16 — a stock
      # redis reports `databases 16` (measured) and worker.redis_db_index refuses an index
      # at or above the server's ceiling instead of silently sharing a logical DB. 12 is
      # clear of the 1..10 band the local build lanes use, and matches .gitlab-ci.yml.
      PROXYSHOP_WORKER: "12"
      # Pinned so a bad upstream release cannot change what this job installs. Same version
      # as .gitlab-ci.yml.
      UV_VERSION: "0.11.8"
      # No datastore endpoint variables at all. compose publishes postgres on 5432, redis on
      # 6379 and neo4j-bolt on 7687 of this runner's localhost, which is exactly what
      # proxyshop_support.reachability, proxyshop_support.postgres._default_dsn and
      # conftest.py already default to. Setting them would be a second copy of addresses
      # that are already right — and on the GitLab side a NEO4J_* variable is actively
      # fatal, so neither file sets one.

    steps:
      - uses: actions/checkout@v4

      # package.json pins node >= 22.12 (D8); preflight.sh fails a stale major by name.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The same pinned installer .gitlab-ci.yml uses, rather than a marketplace action, so
      # the two pipelines provision identically. uv brings its own interpreter:
      # .python-version pins 3.12.13 and `uv sync --locked` fetches exactly that.
      - name: Install uv ${{ env.UV_VERSION }}
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" \
            | env UV_INSTALL_DIR=/usr/local/bin sh
          uv --version

      # `uv sync --locked` and `npm ci` — both FAIL rather than resolve when a lockfile no
      # longer matches its manifest, which is the point of running them here.
      - name: Provision (scripts/bootstrap.sh)
        run: ./scripts/bootstrap.sh

      # The repository's own stack, its own compose file, its own target: `docker compose up
      # -d --wait postgres neo4j redis` followed by `make db-init`. This is the step that
      # makes the pipeline worth having — the ~36 live-Postgres least-privilege checks for
      # C3/S7 skip without it, and a run that skips them reports `22 passed, 36 skipped,
      # exit 0` and proves nothing about database grants.
      - name: Datastores (make deps-up)
        run: make deps-up

      # Refuse early and by name if a datastore is not answering where the tests will look.
      - name: Datastores answer where the tests look
        run: .venv/bin/python scripts/ci_datastore_proof.py wait

      - name: make verify
        run: make verify

      # The claim `make verify` cannot make. Its coverage gate proves the three datastores
      # were REACHABLE; this proves the docker-marked class actually EXECUTED — zero
      # skipped, zero failed, and still the size it was measured at.
      - name: Datastore-backed tests really executed
        run: .venv/bin/python scripts/ci_datastore_proof.py prove

      - name: CI files still agree with docker-compose.yml
        run: .venv/bin/python scripts/ci_datastore_proof.py check-config

      # A datastore that died mid-run explains failures nothing else can. Only on failure,
      # and never allowed to mask the job's own status.
      - name: Datastore logs
        if: failure()
        run: docker compose logs --no-color --tail=200 postgres neo4j redis
